<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог | CoffeeDelice</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">
                    <img src="croissant.png" alt="CoffeeDelice Logo" class="logo-img">
                    </div>
                    <h1 class="logo-text">Coffee<span class="logo-accent">Delice</span></h1>
                </div>
                
                <nav class="nav">
                    <ul class="nav-list">
                        <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i> Главная</a></li>
                        <li><a href="catalog.html" class="nav-link active"><i class="fas fa-store"></i> Каталог</a></li>
                        <li><a href="order.html" class="nav-link"><i class="fas fa-shopping-cart"></i> Заказ</a></li>
                        <li class="cart-indicator">
                            <a href="order.html" class="nav-link cart-link">
                                <i class="fas fa-shopping-bag"></i>
                                <span class="cart-count">0</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <section class="catalog-header">
        <div class="container">
            <h1 class="page-title">Каталог товаров</h1>
            <p class="page-subtitle">Выберите ваш любимый кофе или десерт</p>
        </div>
    </section>

    <!-- Фильтры -->
    <section class="catalog-filters">
        <div class="container">
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all">Все товары</button>
                <button class="filter-tab" data-filter="cakes">Торты</button>
                <button class="filter-tab" data-filter="pastries">Пирожные</button>
                <button class="filter-tab" data-filter="coffee">Напитки</button>
                <button class="filter-tab" data-filter="seasonal">Сезонное</button>
            </div>
        </div>
    </section>

    <!-- Сетка товаров -->
    <section class="catalog-grid">
        <div class="container">
            <div class="products-container" id="productsContainer">
                <!-- Товары загружаются через JS -->
            </div>
        </div>
    </section>

  <!-- Модальное окно товара -->
<div class="modal product-modal" id="productModal">
    <div class="modal-content wide-modal">
        <div class="modal-header">
            <h3 id="modalProductTitle" aria-live="polite">Информация о товаре</h3>
            <button class="modal-close" aria-label="Закрыть окно">&times;</button>
        </div>
        <div class="modal-body">
            <div class="product-modal-content" id="productModalContent">
                <!-- Контент загружается через JS -->
            </div>
        </div>
    </div>
</div>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <h3>CoffeeDelice</h3>
                    <p>Премиум кофейня с авторскими десертами</p>
                </div>
                <div class="footer-info">
                    <h4>Контакты</h4>
                    <p><i class="fas fa-map-marker-alt"></i> ст. Ленинградская, ул. Ярмарочная, 153 А</p>
                    <p><i class="fas fa-phone"></i> +7 (964) 935-48-15</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 CoffeeDelice. Учебный проект.</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
